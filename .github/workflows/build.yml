name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version
      - name: Test core
        run: swift test
      - name: Build app bundle
        run: ./Scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Swift Saber.app" SwiftSaber.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSaber-app
          path: build/SwiftSaber.zip
