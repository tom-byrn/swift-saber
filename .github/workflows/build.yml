name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Unit tests only: independent of the app bundle build and the smoke test,
    # so they run in parallel instead of adding ~5 minutes serially.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-tests-macos-15-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'Helpers/**', 'Resources/**') }}
          restore-keys: spm-tests-macos-15-
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version
      - name: Test core
        run: swift test

  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          # Separate key from the tests job: with one shared key the two concurrent
          # jobs race to save and only the debug build ever gets cached.
          key: spm-build-macos-15-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'Helpers/**', 'Resources/**') }}
          restore-keys: spm-build-macos-15-
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version
      - name: Warm phone simulator (background)
        # Boot two simulators while the package compiles. Boot is mostly disk I/O, so it
        # does not steal CPU from swift test; building the controller app here did
        # (11.9 min test step), so that stays a separate serial step. The second
        # simulator lets the smoke test run its preview-screen screenshot cycle
        # concurrently with the demo instead of after it. Markers let the smoke test
        # know when each boot is done.
        run: |
          # /bin/bash on runners lacks readarray; parse two lines portably.
          UDIDS=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; us=[x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print("\n".join(us[:2]))' || true)
          UDID=$(printf '%s\n' "$UDIDS" | sed -n '1p')
          UDID2=$(printf '%s\n' "$UDIDS" | sed -n '2p')
          if [ -z "$UDID" ]; then
            echo "no simulator available; skipping warm-up"
            exit 0
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          if [ -n "$UDID2" ] && [ "$UDID2" != "$UDID" ]; then
            echo "SIM2_UDID=$UDID2" >> "$GITHUB_ENV"
            touch /tmp/sim2-warming
            nohup bash -c '
              xcrun simctl boot "$0" || true
              xcrun simctl bootstatus "$0" -b
              rm -f /tmp/sim2-warming
              touch /tmp/sim2-ready
            ' "$UDID2" > /tmp/sim2-warm.log 2>&1 &
          fi
          touch /tmp/sim-warming
          nohup bash -c '
            xcrun simctl boot "$0" || true
            xcrun simctl bootstatus "$0" -b
            rm -f /tmp/sim-warming
            touch /tmp/sim-ready
          ' "$UDID" > /tmp/sim-warm.log 2>&1 &
          echo "warm-up running in background for $UDID"
      - name: Build app bundle
        run: ./Scripts/build-app.sh
      - name: Render iPhone app icon
        run: |
          # The iPhone icon is the Mac icon's artwork, full bleed. Export it for reference and
          # fill it in if the committed copy is missing.
          mkdir -p captures
          "build/Swift Saber.app/Contents/MacOS/SwiftSaber" --export-ios-icon "$PWD/captures/ios-app-icon.png"
          ICON=iOSController/SaberController/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          [ -f "$ICON" ] || cp captures/ios-app-icon.png "$ICON"
      - name: Build iPhone controller (simulator)
        run: |
          xcodebuild -project iOSController/SaberController.xcodeproj -target SaberController \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -25
          test "${PIPESTATUS[0]}" -eq 0
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Swift Saber.app" SwiftSaber.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSaber-app
          path: build/SwiftSaber.zip
      - name: Smoke test (autoplay demo + screenshots, iPhone controller in simulator)
        continue-on-error: true
        run: |
          mkdir -p captures
          # Boot an iPhone simulator running Saber Controller; it shares the Mac's network,
          # so it should discover the game over Bonjour and connect.
          UDID="${SIM_UDID:-$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))' || true)}"
          echo "Simulator: $UDID"
          if [ -n "$UDID" ]; then
            # Wait for the background warm-up (boot + controller build + install).
            for i in $(seq 1 180); do
              [ -f /tmp/sim-ready ] && break
              [ -f /tmp/sim-warming ] || break
              sleep 1
            done
            if [ ! -f /tmp/sim-ready ]; then
              echo "warm-up did not finish; falling back:"; tail -20 /tmp/sim-warm.log 2>/dev/null || true
            fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl install "$UDID" iOSController/build/Debug-iphonesimulator/SaberController.app || true
            xcrun simctl launch "$UDID" app.swiftsaber.controller || true
          fi
          "build/Swift Saber.app/Contents/MacOS/SwiftSaber" --demo-capture "$PWD/captures" > captures/app.log 2>&1 &
          PID=$!
          # The preview-screen screenshot cycle only needs the controller app and a
          # simulator, not the demo: run it concurrently on the second simulator and
          # keep the serial path as a fallback.
          preview_cycle() {
            local udid="$1"
            # Every simctl call gets a hard timeout: a hung terminate/launch on a
            # flaky simulator once stalled this cycle past the job's 30m limit.
            sim() { timeout 60 xcrun simctl "$@" || true; }
            for hand in right left; do
              sim terminate "$udid" app.swiftsaber.controller
              sim launch "$udid" app.swiftsaber.controller --preview-$hand
              sleep 3
              sim io "$udid" screenshot "captures/phone-preview-$hand.png"
            done
            # Every remote screen with sample data, plus the hold-to-pause ring mid-hold.
            for screen in menu levelSelect customize settings calibration countdown playing paused results; do
              sim terminate "$udid" app.swiftsaber.controller
              sim launch "$udid" app.swiftsaber.controller --preview-left --preview $screen
              sleep 2
              sim io "$udid" screenshot "captures/phone-remote-$screen.png"
            done
            sim terminate "$udid" app.swiftsaber.controller
            sim launch "$udid" app.swiftsaber.controller --preview-left --preview playing --preview-hold
            sleep 3
            sim io "$udid" screenshot "captures/phone-remote-holding.png"
            sim terminate "$udid" app.swiftsaber.controller
            sleep 2
            sim io "$udid" screenshot "captures/phone-home.png"
          }
          TAIL_PID=""
          SIM2="${SIM2_UDID:-}"
          if [ -n "$SIM2" ] && [ -n "$UDID" ]; then
            (
              for i in $(seq 1 120); do
                [ -f /tmp/sim2-ready ] && break
                [ -f /tmp/sim2-warming ] || break
                sleep 1
              done
              if [ -f /tmp/sim2-ready ]; then
                xcrun simctl install "$SIM2" iOSController/build/Debug-iphonesimulator/SaberController.app || true
                preview_cycle "$SIM2"
              else
                touch /tmp/sim2-failed
              fi
            ) > captures/preview-cycle.log 2>&1 &
            TAIL_PID=$!
            echo "preview cycle running in background on $SIM2"
          fi
          # The game logs "phone-shot: <screen>" once each screen has been mirrored to the
          # phone (it navigates with the same remote commands the phone sends).
          SHOT=0
          for i in $(seq 1 480); do
            kill -0 $PID 2>/dev/null || break
            if [ -n "$UDID" ]; then
              NAMES=$(grep -o 'phone-shot: [a-z]*' captures/app.log 2>/dev/null | sed 's/phone-shot: //' || true)
              COUNT=$(printf '%s\n' "$NAMES" | grep -c . || true)
              for name in $(printf '%s\n' "$NAMES" | tail -n +$((SHOT + 1))); do
                xcrun simctl io "$UDID" screenshot "captures/phone-live-$name.png" || true
              done
              SHOT=${COUNT:-0}
            fi
            sleep 0.5
          done
          if kill -0 $PID 2>/dev/null; then echo "app still running, killing"; kill $PID; fi
          wait $PID; echo "exit code: $?"
          tail -60 captures/app.log
          if [ -n "$UDID" ]; then
            # Phone-side connection log, to diagnose discovery problems.
            xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'eventMessage CONTAINS "SaberRemote"' > captures/phone.log 2>&1 || true
            tail -40 captures/phone.log
          fi
          if [ -n "$TAIL_PID" ]; then
            wait "$TAIL_PID" || true
            tail -5 captures/preview-cycle.log 2>/dev/null || true
          fi
          if [ ! -f /tmp/sim2-failed ] && [ -z "$TAIL_PID" ] && [ -n "$UDID" ]; then
            # Fallback: no second simulator, run the cycle serially as before.
            preview_cycle "$UDID"
          fi
          [ -f /tmp/sim2-failed ] && echo "second simulator did not boot; preview screenshots may be missing"
          ls -la captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwiftSaber-captures
          path: captures/
