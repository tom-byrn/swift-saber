<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Swift Saber</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0624"/>
      <stop offset="0.55" stop-color="#0a0718"/>
      <stop offset="1" stop-color="#020412"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e6dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2e6dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f74ff"/>
      <stop offset="1" stop-color="#0c2f8f"/>
    </linearGradient>
    <linearGradient id="hilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e7ee"/>
      <stop offset="1" stop-color="#7d8594"/>
    </linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="40" y="40" width="432" height="432" rx="96"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#tile)"/>

  <g clip-path="url(#clip)">
    <!-- Receding prism rings -->
    <g fill="none" stroke-width="3" stroke-linejoin="round">
      <polygon points="256,186 305.5,206.5 326,256 305.5,305.5 256,326 206.5,305.5 186,256 206.5,206.5" stroke="#3a7dff" stroke-opacity="0.42"/>
      <polygon points="256,142 336.6,175.4 370,256 336.6,336.6 256,370 175.4,336.6 142,256 175.4,175.4" stroke="#ff3a55" stroke-opacity="0.32"/>
      <polygon points="256,98 367.7,144.3 414,256 367.7,367.7 256,414 144.3,367.7 98,256 144.3,144.3" stroke="#3a7dff" stroke-opacity="0.26"/>
      <polygon points="256,54 398.8,113.2 458,256 398.8,398.8 256,458 113.2,398.8 54,256 113.2,113.2" stroke="#ff3a55" stroke-opacity="0.2"/>
    </g>

    <!-- Halo behind the block -->
    <circle cx="256" cy="200" r="130" fill="url(#halo)"/>

    <!-- Block with a downward cut arrow -->
    <g transform="rotate(-8 256 188)">
      <rect x="202" y="134" width="108" height="108" rx="18" fill="url(#block)"/>
      <rect x="202" y="134" width="108" height="108" rx="18" fill="none" stroke="#8fb8ff" stroke-width="3"/>
      <rect x="208" y="140" width="96" height="42" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <polygon points="222,172 290,172 256,208" fill="#ffffff" filter="url(#bloom)"/>
    </g>

    <!-- Red saber (left hand): hilt bottom-left, blade to top-right -->
    <g stroke-linecap="round">
      <line x1="156" y1="412" x2="391" y2="177" stroke="#ff2640" stroke-opacity="0.18" stroke-width="40"/>
      <line x1="156" y1="412" x2="391" y2="177" stroke="#ff2640" stroke-opacity="0.45" stroke-width="22" filter="url(#bloom)"/>
      <line x1="156" y1="412" x2="391" y2="177" stroke="#ff4d63" stroke-width="13"/>
      <line x1="156" y1="412" x2="391" y2="177" stroke="#ffffff" stroke-width="5"/>
    </g>
    <!-- Blue saber (right hand): hilt bottom-right, blade to top-left -->
    <g stroke-linecap="round">
      <line x1="356" y1="412" x2="121" y2="177" stroke="#2e8cff" stroke-opacity="0.18" stroke-width="40"/>
      <line x1="356" y1="412" x2="121" y2="177" stroke="#2e8cff" stroke-opacity="0.45" stroke-width="22" filter="url(#bloom)"/>
      <line x1="356" y1="412" x2="121" y2="177" stroke="#4da3ff" stroke-width="13"/>
      <line x1="356" y1="412" x2="121" y2="177" stroke="#ffffff" stroke-width="5"/>
    </g>

    <!-- Hilts -->
    <g stroke-linecap="round">
      <line x1="158" y1="410" x2="128" y2="440" stroke="url(#hilt)" stroke-width="17"/>
      <line x1="354" y1="410" x2="384" y2="440" stroke="url(#hilt)" stroke-width="17"/>
      <!-- Emitter collars -->
      <line x1="144" y1="408" x2="156" y2="420" stroke="#c9ced8" stroke-width="7"/>
      <line x1="356" y1="420" x2="368" y2="408" stroke="#c9ced8" stroke-width="7"/>
      <line x1="134" y1="422" x2="142" y2="430" stroke="#ff2640" stroke-width="4"/>
      <line x1="370" y1="430" x2="378" y2="422" stroke="#2e8cff" stroke-width="4"/>
    </g>
  </g>

  <!-- Rim -->
  <rect x="41.5" y="41.5" width="429" height="429" rx="94.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
</svg>
